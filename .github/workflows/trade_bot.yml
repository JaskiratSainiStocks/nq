name: Automated Pre-School Trading Bot

on:
  schedule:
    # Runs Monday-Friday at 13:35 UTC (06:35 AM PST / 09:35 AM EST)
    - cron: '35 13 * * 1-5'
  workflow_dispatch: # Allows manual 1-click test anytime!

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests

      - name: Execute Master Model 3.0 Bot
        env:
          TICKSTREAM_API_KEY: ${{ secrets.TICKSTREAM_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRADOVATE_USER: ${{ secrets.TRADOVATE_USER }}
          TRADOVATE_PASS: ${{ secrets.TRADOVATE_PASS }}
          TRADOVATE_ACCOUNT_ID: ${{ secrets.TRADOVATE_ACCOUNT_ID }}
        run: |
          python auto_bot.py
