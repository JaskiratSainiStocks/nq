name: Daily Data Task

on:
  schedule:
    # 1. Window 1: 09:00 UTC (05:00 AM EST / 02:00 AM PST)
    - cron: '0 9 * * 1-5'
    # 2. Window 2: 14:00 UTC (10:00 AM EST / 07:00 AM PST)
    - cron: '0 14 * * 1-5'
    # 3. Window 3: 17:00 UTC (01:00 PM EST / 10:00 AM PST)
    - cron: '0 17 * * 1-5'
  workflow_dispatch:

jobs:
  run-task:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests matplotlib polars

      - name: Execute Main Script
        env:
          TICKSTREAM_API_KEY: ${{ secrets.TICKSTREAM_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRADOVATE_USER: ${{ secrets.TRADOVATE_USER }}
          TRADOVATE_PASS: ${{ secrets.TRADOVATE_PASS }}
          TRADOVATE_ACCOUNT_ID: ${{ secrets.TRADOVATE_ACCOUNT_ID }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          python main.py
