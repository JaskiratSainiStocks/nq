name: Daily Data Task

on:
  workflow_dispatch: # Allows manual triggering
  schedule:
    # Runs at market close (4:00 PM EST / 1:00 PM PST) Monday-Friday
    - cron: '0 20 * * 1-5' 

jobs:
  run-task:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Speeds up future runs

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Main Script
        env:
          # Ensure these secrets are added in your GitHub Repo Settings
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          # Add any other API keys here (e.g., for pulling GEX data)
        run: python auto_bot.py
